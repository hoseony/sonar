# Builds the explorer and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
#
# The connection index (public/index/) is built from the latest MusicBrainz JSON dump plus the
# Discogs links file (a release attachment, checked against data/discogs-links.sha256), and cached
# per dump and links file, so the ~1.8 GB download only happens when MusicBrainz publishes a new dump.
# The weekly schedule picks up new data even when nothing was pushed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Find latest MusicBrainz dump and Discogs links
        id: dump
        run: |
          name=$(curl -fsS https://data.metabrainz.org/pub/musicbrainz/data/json-dumps/LATEST | tr -d '[:space:]')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # The Discogs links file's expected hash is committed (data/discogs-links.sha256):
          # a new links file means a new hash, so a new cache key and a rebuild.
          echo "links=$(cut -c1-16 data/discogs-links.sha256)" >> "$GITHUB_OUTPUT"

      - name: Restore connection index
        id: index-cache
        uses: actions/cache/restore@v5
        with:
          path: public/index
          # Bump the version when the index format or builder changes (src/shared/index-format.ts).
          key: index-v5-${{ steps.dump.outputs.name }}-${{ steps.dump.outputs.links }}

      - name: Build connection index
        if: steps.index-cache.outputs.cache-hit != 'true'
        env:
          DUMP_NAME: ${{ steps.dump.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/dump
          base=https://data.metabrainz.org/pub/musicbrainz/data/json-dumps/$DUMP_NAME
          curl -fsSL -o .cache/dump/artist.tar.xz "$base/artist.tar.xz"
          curl -fsSL "$base/SHA256SUMS" | grep 'artist.tar.xz$' | sed 's#\*\?artist.tar.xz$#.cache/dump/artist.tar.xz#' | sha256sum -c -

          # Discogs credits come from a links file extracted locally from the Discogs dump (Discogs
          # refuses downloads from CI) and attached to the "discogs-links" release. If it's missing
          # or doesn't match the committed hash, stop: better the current site than one without it.
          gh release download discogs-links --repo "$GITHUB_REPOSITORY" --pattern discogs-links.tsv.gz --dir .cache/dump \
            || { echo "::error::No discogs-links.tsv.gz on the discogs-links release (see README)"; exit 1; }
          (cd .cache/dump && sha256sum -c "$GITHUB_WORKSPACE/data/discogs-links.sha256") \
            || { echo "::error::discogs-links.tsv.gz doesn't match data/discogs-links.sha256"; exit 1; }

          DISCOGS=.cache/dump/discogs-links.tsv.gz npm run build-index -- .cache/dump/artist.tar.xz
          rm -f .cache/dump/*

      - name: Save connection index
        if: steps.index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: public/index
          key: index-v5-${{ steps.dump.outputs.name }}-${{ steps.dump.outputs.links }}

      - run: npm run build
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
